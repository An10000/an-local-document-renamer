<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Document Renamer</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="page-box">
        <h1>Local Document Renamer</h1>
        <div class="main-box">
            <div class="left-panel">
                <div id="drop-zone">
                    <p>Drop PDF Here</p>
                    <p>or click to select</p>
                    <input
                        type="file"
                        id="file-input"
                        accept="application/pdf"
                        hidden
                    >
                </div>
                <iframe id="pdf-viewer"></iframe>
            </div>

            <div class="right-panel">
                Right
            </div>
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
