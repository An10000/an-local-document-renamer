<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Document Renamer</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="page-box">
        <h1>Local Document Renamer</h1>
        <div class="main-box">
            <div class="left-panel">
                <div id="drop-zone">
                    <p>Drop PDF Here</p>
                    <p>or click to select</p>
                    <input
                        type="file"
                        id="file-input"
                        accept="application/pdf"
                        hidden
                    >
                </div>
                <iframe id="pdf-viewer"></iframe>
            </div>

            <div class="right-panel">
                <table class="info-table">
                    <tr class="info-table-row">
                        <td>
                            <p>AWB:</p>
                        </td>
                        <td>
                            <input type="text" id="awb-input" placeholder="Enter AWB">
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <p>pcs: </p>
                        </td>
                        <td>
                            <input type="text" id="pcs-input" placeholder="Enter pcs">
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <p>parts: </p>
                        </td>
                        <td>
                            <label>
                                <input type="radio" name="parts" value="yes">
                                Yes
                            </label>

                            <label>
                                <input type="radio" name="parts" value="no">
                                No
                            </label>
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <p>skids: </p>
                        </td>
                        <td>
                            <input type="text" id="skids-input" placeholder="Enter skids">
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <p>CAD: </p>
                        </td>
                        <td>
                            <input type="text" id="cad-input" placeholder="Enter CAD">
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <details>
                                <summary>LFD</summary>
                                <div class="details-content">
                                    <table>
                                        <tr>
                                            <td>
                                                <p>AN date: </p>
                                            </td>
                                            <td>
                                                <input type="date" id="an-date" placeholder="AN Date">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <p>Storage Period(days): </p>
                                            </td>
                                            <td>
                                                <input type="number" id="storage-period-days" placeholder="Storage Period (days)">
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </details>
                        </td>
                        <td>
                            <input type="date" id="lfd-input" placeholder="Enter LFD">
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    <script src="./main.js"></script>
</body>
</html>
