<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Document Renamer</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="page-box">
        <h1>空运AN重命名工具</h1>
        <div class="main-box">
            <div class="left-panel">
                <div id="drop-zone">
                    <p>Drop PDF Here</p>
                    <p>or click to select</p>
                    <input
                        type="file"
                        id="file-input"
                        accept="application/pdf"
                        hidden
                    >
                </div>
                <iframe id="pdf-viewer"></iframe>
            </div>

            <div class="right-panel">
                <table class="info-table">
                    <tr class="info-table-row">
                        <td>
                            <p>AWB:</p>
                        </td>
                        <td>
                            <input type="text" id="awb-input" placeholder="Enter AWB" class="info-table-input">
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <p>pcs: </p>
                        </td>
                        <td>
                            <input type="text" id="pcs-input" placeholder="Enter pcs" class="info-table-input">
                        </td>
                    </tr>
                    <tr class="info-table-row" style="display: none;">
                        <td>
                            <p>parts: </p>
                        </td>
                        <td class="radio-group">
                            <label>
                                <input type="radio" name="parts" value="yes">
                                Yes
                            </label>

                            <label>
                                <input type="radio" name="parts" value="no">
                                No
                            </label>
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <p>skids: </p>
                        </td>
                        <td>
                            <input type="text" id="skids-input" placeholder="Enter skids" class="info-table-input">
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <p>CAD: </p>
                        </td>
                        <td>
                            <input type="text" id="cad-input" placeholder="Enter CAD" class="info-table-input">
                        </td>
                    </tr>
                    <tr class="info-table-row">
                        <td>
                            <details>
                                <summary>LFD</summary>
                                <div class="details-content">
                                    <table>
                                        <tr>
                                            <td>
                                                <p>AN date: </p>
                                            </td>
                                            <td>
                                                <input type="date" id="an-date" placeholder="AN Date" class="info-table-input">
                                            </td>
                                        </tr>
                                        <tr>
                                            <td>
                                                <p>Storage Period(days): </p>
                                            </td>
                                            <td>
                                                <input type="number" id="storage-period-days" placeholder="Storage Period (days)" class="info-table-input">
                                            </td>
                                        </tr>
                                    </table>
                                </div>
                            </details>
                        </td>
                        <td>
                            <input type="date" id="lfd-input" placeholder="Enter LFD" class="info-table-input">
                        </td>
                    </tr>
                </table>
                <p>New Filename:</p>
                <div class="filename-output">
                    
                    <input
                        id="filename-text"
                        type="text"
                        value="Andy_2026-09-05_Insurance_Document.pdf"
                    >

                    <button id="copy-button" type="button" title="Copy filename">
                        <svg
                            id="copy-icon"
                            width="20"
                            height="20"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <rect x="9" y="9" width="11" height="11" rx="2"></rect>
                            <rect x="4" y="4" width="11" height="11" rx="2"></rect>
                        </svg>

                        <span id="check-icon">✓</span>
                    </button>
                </div>
                <div class="refresh-section">
                    <button
                        id="refresh-button"
                        class="icon-button"
                        title="Start next file"
                        type="button"
                    >
                        <svg
                            viewBox="0 0 24 24"
                            width="20"
                            height="20"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M20 11a8.1 8.1 0 0 0-15.5-2M4 4v5h5"></path>
                            <path d="M4 13a8.1 8.1 0 0 0 15.5 2M20 20v-5h-5"></path>
                        </svg>
                    </button>
                    <span id="refresh-check">✓</span>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="./main.js"></script>
</body>
</html>
